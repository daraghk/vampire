[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-search"
version = "0.1.0"
description = "Parallel Vampire search with LLM-generated, entailment-verified lemmas"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["parallel_search*"]
